name: Build installers

# Matrix build for the three desktop targets (feature pkg-016).
# Produces the PyInstaller sidecar per OS/architecture and bundles it via
# Tauri's externalBin.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Sync Python backend
        run: uv sync --project backend

      - name: Install frontend dependencies
        run: npm install

      - name: Build sidecar (PyInstaller)
        run: bash scripts/build-sidecar.sh ${{ matrix.triple }}

      - name: Baseline verification
        run: |
          cd backend && uv run ruff check . && uv run pytest
          cd .. && npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Smoke test the frozen sidecar
        shell: bash
        run: |
          BINARY="backend/dist/stage-finder-backend"
          if [[ "$RUNNER_OS" == "Windows" ]]; then BINARY="$BINARY.exe"; fi
          export STAGE_FINDER_PORT=18971
          export STAGE_FINDER_SESSION_TOKEN=ci-smoke-token
          export STAGE_FINDER_DATA_DIR="$RUNNER_TEMP/stage-finder-ci-data"
          mkdir -p "$STAGE_FINDER_DATA_DIR"
          LOG="$RUNNER_TEMP/stage-finder-ci-data/sidecar.log"
          "$BINARY" >"$LOG" 2>&1 &
          SIDECAR_PID=$!
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18971/health || true)
            if [[ "$code" == "401" ]]; then ok=1; break; fi
            sleep 1
          done
          unauthorized=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18971/health || true)
          authorized=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ci-smoke-token" http://127.0.0.1:18971/health || true)
          echo "health without token: $unauthorized (want 401)"
          echo "health with token: $authorized (want 200)"
          if [[ "$unauthorized" != "401" || "$authorized" != "200" ]]; then
            echo "Frozen sidecar smoke test FAILED; sidecar log:"
            cat "$LOG" || true
            kill $SIDECAR_PID 2>/dev/null || true
            exit 1
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then taskkill //F //IM stage-finder-backend.exe || true; else kill $SIDECAR_PID 2>/dev/null || true; fi

      - name: Package portable build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "src-tauri\target\release\stage-finder.exe" portable\
          Copy-Item "src-tauri\binaries\stage-finder-backend-x86_64-pc-windows-msvc.exe" "portable\stage-finder-backend.exe"
          Compress-Archive -Path portable\* -DestinationPath StageFinder-portable-win64.zip

      - name: Upload portable artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stage-finder-portable-win64
          path: StageFinder-portable-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: stage-finder-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
          if-no-files-found: warn

  release:
    # Publish a GitHub Release with the installers when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List installers
        run: find artifacts -type f -printf "%f (%s bytes)\n" | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
