[project]
name = "stage-finder-backend"
version = "0.1.0"
description = "Stage Finder FastAPI sidecar backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "openai>=3.40.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migration files keep their original formatting.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
