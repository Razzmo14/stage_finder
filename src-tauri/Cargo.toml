[package]
name = "stage-finder"
version = "0.1.0"
description = "Stage Finder desktop app (Tauri core)"
edition = "2021"

[lib]
name = "stage_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
